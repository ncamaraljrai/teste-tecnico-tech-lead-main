databases:
  - name: ilumeo-conversions
    databaseName: conversions
    user: conversions
    plan: free

services:
  - type: web
    name: ilumeo-conversion-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ilumeo-conversions
          property: connectionString
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        value: https://ilumeo-conversion-web.onrender.com

  - type: web
    name: ilumeo-conversion-web
    runtime: docker
    plan: free
    dockerfilePath: ./client/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: API_UPSTREAM
        value: https://ilumeo-conversion-api.onrender.com
      - key: API_RESOLVER
        value: 1.1.1.1 8.8.8.8
      - key: PORT
        value: 10000