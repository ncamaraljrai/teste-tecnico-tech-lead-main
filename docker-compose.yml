services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: conversions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/01_source_schema.sql:/docker-entrypoint-initdb.d/01_source_schema.sql:ro
      - ./db/case_tech_lead.sql:/docker-entrypoint-initdb.d/02_case_tech_lead.sql:ro
      - ./db/03_transform.sql:/docker-entrypoint-initdb.d/03_transform.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conversions"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/conversions
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/ready"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 180
  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    depends_on: [api]
    environment:
      API_UPSTREAM: http://api:3000
      API_RESOLVER: 127.0.0.11
      PORT: 80
    ports: ["8080:80"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data: